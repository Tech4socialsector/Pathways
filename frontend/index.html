<!doctype html>
<html class="h-full" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pathways</title>
    <!-- Installable app (PWA): manifest + worker are served by the backend
         at the site root (pathways/pwa/__init__.py), see src/utils/pwa.js. -->
    <link rel="manifest" href="/pathways.webmanifest" />
    <meta name="theme-color" content="#920C24" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pathways" />
    <link rel="apple-touch-icon" href="/assets/pathways/pwa/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/pathways/pwa/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/assets/pathways/pwa/icon.svg" />
    <script>
      // Chrome can fire its install event before the app script loads; keep it.
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault()
        window.__pwaInstallEvent = e
      })
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,400&display=swap"
    />
  </head>
  <body class="h-full">
    <div id="app" class="h-full"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
